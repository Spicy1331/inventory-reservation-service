apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
  labels:
    app: inventory-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-app
  template:
    metadata:
      labels:
        app: inventory-app
    spec:
      containers:
        - name: inventory-app
          # Assumes the local image name. If deploying to cloud, replace with your Docker Hub registry path.
          image: inventory-app:latest
          imagePullPolicy: IfNotPresent # Allows Kubernetes to resolve locally built image if present
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: JWT_SECRET
            - name: CRON_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: CRON_SECRET
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: app-service
  labels:
    app: inventory-app
spec:
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080 # Exposes the service at http://localhost:30080 on your machine
  selector:
    app: inventory-app
  type: NodePort
